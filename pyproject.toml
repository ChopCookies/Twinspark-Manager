[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinspark-manager"
version = "0.4.1"
description = "Headless-first vLLM appliance manager for NVIDIA DGX Spark"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.scripts]
tsm = "twinspark.cli:main"

[tool.setuptools.packages.find]
include = ["twinspark*"]

[tool.setuptools.package-data]
twinspark = ["cookbook/recipes/*.json", "cookbook/recipes/*.yaml", "cookbook/recipes/*.yml",
             "web/dist/*.html", "web/dist/css/*.css", "web/dist/js/*.js"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]                    # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"twinspark/api/*" = ["B904"]         # HTTPException re-raised from the handler is intended

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
