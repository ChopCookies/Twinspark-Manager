[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinspark-manager"
version = "0.5.0"
description = "Model manager for two NVIDIA DGX Sparks: vLLM recipes, one OpenAI-compatible endpoint, web GUI and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "twinspark/web/dist/vendor/LICENSE-xterm.txt"]
authors = [{ name = "ChopCookies" }]
keywords = ["vllm", "dgx-spark", "gb10", "llm", "inference", "openai-compatible", "nccl", "roce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anyio>=4",
    "cryptography>=42.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.urls]
Homepage = "https://github.com/ChopCookies/Twinspark-Manager"
Documentation = "https://github.com/ChopCookies/Twinspark-Manager/tree/main/docs"
Issues = "https://github.com/ChopCookies/Twinspark-Manager/issues"
Changelog = "https://github.com/ChopCookies/Twinspark-Manager/blob/main/CHANGELOG.md"

[project.scripts]
tsm = "twinspark.cli:main"

[tool.setuptools.packages.find]
include = ["twinspark*"]

[tool.setuptools.package-data]
twinspark = ["cookbook/recipes/*.json", "cookbook/recipes/*.yaml", "cookbook/recipes/*.yml",
             "web/dist/*.html", "web/dist/css/*.css", "web/dist/js/*.js", "web/dist/vendor/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]                    # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"twinspark/api/*" = ["B904"]         # HTTPException re-raised from the handler is intended
"scripts/*" = ["E402", "B905"]       # dev scripts put the repo on sys.path before importing it

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
