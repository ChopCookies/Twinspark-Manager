[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinspark-manager"
version = "0.8.0"
description = "Model manager for two NVIDIA DGX Sparks: vLLM recipes, one OpenAI-compatible endpoint, web GUI and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "twinspark/web/dist/vendor/LICENSE-xterm.txt"]
authors = [{ name = "ChopCookies" }]
keywords = ["vllm", "dgx-spark", "gb10", "llm", "inference", "openai-compatible", "nccl", "roce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
# Lower bounds without a published advisory against them (pip-audit): Starlette before 1.3.1 (Host/path
# handling of request.url, form limits), anyio before 4.14.2, cryptography before 50.0 (bundled OpenSSL,
# certificate verification). FastAPI 0.133 is the first that accepts Starlette 1.x.
dependencies = [
    "fastapi>=0.133",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "websockets>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anyio>=4.14.2",
    "cryptography>=50.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
# the workstation client: keys in the system keychain (macOS Keychain, Windows Credential Manager, Secret Service)
client = ["keyring>=24"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3", "ruff"]

[project.urls]
Homepage = "https://github.com/ChopCookies/Twinspark-Manager"
Documentation = "https://github.com/ChopCookies/Twinspark-Manager/tree/main/docs"
Issues = "https://github.com/ChopCookies/Twinspark-Manager/issues"
Changelog = "https://github.com/ChopCookies/Twinspark-Manager/blob/main/CHANGELOG.md"

[project.scripts]
tsm = "twinspark.cli:main"

[tool.setuptools.packages.find]
include = ["twinspark*"]

[tool.setuptools.package-data]
twinspark = ["cookbook/recipes/*.json", "cookbook/recipes/*.yaml", "cookbook/recipes/*.yml",
             "web/dist/*.html", "web/dist/css/*.css", "web/dist/js/*.js", "web/dist/vendor/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]                    # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"twinspark/api/*" = ["B904"]         # HTTPException re-raised from the handler is intended
"scripts/*" = ["E402", "B905"]       # dev scripts put the repo on sys.path before importing it

[tool.mypy]
python_version = "3.12"
files = ["twinspark"]
ignore_missing_imports = true
warn_unused_ignores = true

# The modules below were written before mypy ran in CI. Their remaining findings (mostly Optional values
# used without a check, and loose dict types) are being fixed one module at a time: delete a name from this list
# once `mypy` is clean for it. Every other module, and every new one, is checked in CI.
[[tool.mypy.overrides]]
module = [
    "twinspark.agent.sysinfo",
    "twinspark.agent.timeline",
    "twinspark.api.routes_benchmarks",
    "twinspark.api.routes_cookbook",
    "twinspark.api.routes_diagnostics",
    "twinspark.client.adapters.hermes",
    "twinspark.client.adapters.validate",
    "twinspark.client.app",
    "twinspark.client.bench",
    "twinspark.client.bench_local",
    "twinspark.client.discovery",
    "twinspark.client.session",
    "twinspark.controller.controller",
    "twinspark.controller.evidence",
    "twinspark.controller.files",
    "twinspark.controller.halves",
    "twinspark.controller.integration",
    "twinspark.controller.integrations",
    "twinspark.controller.jobs",
    "twinspark.controller.launch",
    "twinspark.controller.measurements",
    "twinspark.controller.pinning",
    "twinspark.controller.planner",
    "twinspark.controller.playground",
    "twinspark.controller.timeline",
    "twinspark.cookbook.community",
    "twinspark.cookbook.eugr",
    "twinspark.demo",
    "twinspark.gateway.app",
    "twinspark.metrics",
    "twinspark.qsfp",
]
ignore_errors = true

[tool.coverage.run]
source = ["twinspark"]

[tool.coverage.report]
# CI fails below this; hardware-only paths (Docker, RDMA, privd, systemd) are what is left uncovered
fail_under = 80
skip_empty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
