# Reference only — `sudo tsm setup` writes this file for you (and keeps it up to date).
# /etc/twinspark/agent.yaml — Node B
node: {node_id: B, role: agent}
listener: {bind: 192.168.100.2, port: 9443}  # QSFP IP only — not reachable from the LAN
secrets_dir: /etc/twinspark/secrets
runtime_mode: dry-run
runtime:
  vllm_port: 8100
  hf_cache_dir: /var/lib/twinspark/hf-cache
  compile_cache_dir: /var/cache/twinspark/compile
# Remote management (optional). What is ALLOWED is decided by /etc/twinspark/remote-policy.json,
# not by this file: `sudo tsm remote enable terminal reboot` / `sudo tsm remote policy`.
# remote_mgmt:
#   terminal_port: 9444
#   record_dir: /var/lib/twinspark/terminal      # terminal session recordings (asciicast, 0600)
